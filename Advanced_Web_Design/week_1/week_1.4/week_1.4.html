<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1.4 — CSS Grid Recreation</title>
<style>
    .container {
        display: grid;
        height: 100vh;
        gap: 10px;
        padding: 10px;
        box-sizing: border-box;
        /* Sütunları 4 eşit parçaya bölüyoruz */
        grid-template-columns: repeat(4, 1fr);
        /* Satırları da görseldeki yüksekliğe göre 4 parçaya bölüyoruz */
        grid-template-rows: repeat(4, 1fr);
    }

    .item {
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 24px;
        font-weight: bold;
    }

    .a { background: red; grid-column: 1 / 5; grid-row: 1 / 2; }
    
    /* B, 2. ve 3. satırı kaplıyor */
    .b { background: green; grid-column: 1 / 2; grid-row: 2 / 4; }
    
    /* C, 2. satırda, B'nin yanından başlayıp sona kadar */
    .c { background: orange; grid-column: 2 / 5; grid-row: 2 / 3; }
    
    /* D, 3. satırda, 2. ve 3. sütunu kaplıyor */
    .d { background: brown; grid-column: 2 / 4; grid-row: 3 / 4; }
    
    /* E, 3. satırda, 4. sütunu kaplıyor */
    .e { background: purple; grid-column: 4 / 5; grid-row: 3 / 4; }
    
    /* F, en alt satır */
    .f { background: black; grid-column: 1 / 5; grid-row: 4 / 5; }
    
</style>
</head>
<body>
    <div class="container">
        <div class="item a">A</div>
        <div class="item b">B</div>
        <div class="item c">C</div>
        <div class="item d">D</div>
        <div class="item e">E</div>
        <div class="item f">F</div>
    </div>
</body>
</html>
